services:
  friday-match-wallet-db:
    image: postgres:16-alpine
    container_name: friday-match-wallet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: friday_match_wallet
    ports:
      - "5433:5432"
    volumes:
      - friday_match_wallet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d friday_match_wallet
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  friday_match_wallet_postgres_data:
